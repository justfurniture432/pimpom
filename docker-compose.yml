services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes:
      - ./logs:/app/logs   # lo que recibe la API queda en logs/ del repositorio (laboratorio de drift)
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]