prepare:
  target: G3                # columna que se quiere predecir
  drop_columns: [school,reason,guardian,G1,G2]   # identificadores o columnas que no aportan
  test_size: 0.2
  random_state: 42

train:
  n_estimators: 80
  max_depth: 5

mlflow:
  experiment: integrador-equipo-X   # cambiar X por el nombre del equipo
  model_name: modelo-equipo-X
