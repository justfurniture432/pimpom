name: Reentreno

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  reentrenar:
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/justfurniture432/pimpom.mlflow
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      METRICA: rmse

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Traer datos y modelo
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user "$DAGSHUB_USER"
          dvc remote modify dagshub --local password "$DAGSHUB_TOKEN"
          dvc pull

      - name: Reentrenar
        run: |
          cp metrics.json metrics_antes.json
          dvc repro

      - name: Comparar con el modelo en uso
        id: comparar
        run: |
          python - <<'FIN' >> "$GITHUB_OUTPUT"
          import json
          import math
          import os
          import sys

          metrica = os.environ["METRICA"]

          with open("metrics_antes.json", encoding="utf-8") as archivo:
              antes = float(json.load(archivo)[metrica])

          with open("metrics.json", encoding="utf-8") as archivo:
              ahora = float(json.load(archivo)[metrica])

          if not all(math.isfinite(valor) for valor in (antes, ahora)):
              raise SystemExit("Las métricas deben ser números finitos.")

          print(
              f"{metrica}: antes {antes}, ahora {ahora}",
              file=sys.stderr,
          )
          print("mejora=" + ("true" if ahora <= antes else "false"))
          FIN

      - name: Subir el modelo nuevo a DagsHub
        if: steps.comparar.outputs.mejora == 'true'
        run: dvc push

      - name: Abrir el Pull Request
        if: steps.comparar.outputs.mejora == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: reentreno/automatico
          base: master
          add-paths: |
            dvc.lock
            metrics.json
          commit-message: Reentrena el modelo con los datos actuales
          title: "Reentreno: modelo con RMSE igual o menor"
          body: |
            El workflow Reentreno generó un modelo con RMSE
            igual o menor que el modelo de referencia.
            Revisen metrics.json y el run en MLflow antes de aprobar.
            Al unir este PR, el CD publica la imagen.
